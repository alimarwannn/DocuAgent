[theme]
base = "light"
primaryColor = "#E60000"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17191D"
borderColor = "#E4E7EC"
buttonRadius = "0.65rem"
showSidebarBorder = true

[theme.sidebar]
primaryColor = "#E60000"
backgroundColor = "#111318"
secondaryBackgroundColor = "#1B1E24"
textColor = "#F5F5F5"
borderColor = "#2B3038"
